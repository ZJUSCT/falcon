name: CI

# Branch pushes and PRs run the checks. Tag pushes are intentionally not
# triggered here: release.yml publishes artifacts from a tag without
# re-running checks — tag a commit whose CI has already passed.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every leg finish so one failure doesn't hide others.
      fail-fast: false
      matrix:
        # Each containerized check group (and the e2e scenario) runs as its
        # own leg: the tool image builds overlap instead of stacking behind
        # `make check`'s sequential run (the groups are also the local
        # entry points).
        check: [hygiene, verify-generated, go-checks, ui-checks, chart-checks, e2e]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run the check group
        run: make ${{ matrix.check }}
