name: CI

# Branch pushes and PRs run the checks. Tag pushes are intentionally not
# triggered here: release.yml publishes artifacts from a tag without
# re-running checks — tag a commit whose CI has already passed.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  checks:
    name: Containerized checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run the same checks as local development
        run: make check

  e2e:
    name: End-to-end (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run the e2e scenario
        run: make e2e

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: .e2e-dump/
          if-no-files-found: ignore
