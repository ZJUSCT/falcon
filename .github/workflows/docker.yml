name: docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  controller:
    name: Build and push controller image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR rejects uppercase in repository paths
          sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE=ghcr.io/${owner_lc}/falcon:${sha}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}

  ui:
    name: Build and push UI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image reference
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR rejects uppercase in repository paths
          sha=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE=ghcr.io/${owner_lc}/falcon-ui:${sha}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
