name: release-chart

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  OCI_REGISTRY: ghcr.io
  OCI_OWNER: ${{ github.repository_owner }}
  CHART_PATH: charts/falcon
  # `helm push` APPENDS the chart name to this path (verified: pushing to
  # .../charts/falcon lands at .../charts/falcon/falcon), so this stays
  # "charts" — the artifact lands at ghcr.io/<owner>/charts/falcon:<version>.
  CHART_REPO_PATH: charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release version
        # The release tag is the single source of truth: the chart version is
        # the tag without the "v" prefix (v0.0.0 -> 0.0.0).
        run: |
          echo "CHART_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Stamp version and appVersion into Chart.yaml
        # The checked-in version/appVersion fields are placeholders; each
        # release tag (v<semver>) stamps the chart version (tag without the
        # "v" prefix) and appVersion (the tag verbatim).
        run: |
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" "$CHART_PATH/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: \"${GITHUB_REF_NAME}\"/" "$CHART_PATH/Chart.yaml"

      - name: Lint chart
        run: helm lint "$CHART_PATH" --strict

      - name: Package chart
        run: helm package "$CHART_PATH"

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login "$OCI_REGISTRY" \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        # ${VAR,,} lowercases: GHCR requires lowercase repository paths.
        shell: bash
        run: helm push "falcon-${CHART_VERSION}.tgz" "oci://${OCI_REGISTRY,,}/${OCI_OWNER,,}/${CHART_REPO_PATH}"
