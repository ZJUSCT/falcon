name: Go

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['*']
  # Reused by release.yml as the check stage for tag pushes; tags do not
  # trigger this workflow directly to avoid a duplicate check run.
  workflow_call:

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: ^1.26
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run tests
        run: go test -race -v ./...
