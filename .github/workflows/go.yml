name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['*']
  # Reused by release.yml as the check stage for tag pushes; tags do not
  # trigger this workflow directly to avoid a duplicate check run.
  workflow_call:

jobs:
  checks:
    name: Containerized checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run the same checks as local development
        run: make check
