# Default values for the Falcon chart.
# Everything renders into the release namespace; the controller watches only
# that namespace (POD_NAMESPACE).
# Site identity and Gateway topology are deployment-specific and ship empty:
# site.url is required, and every route needs a gatewayRef (or parentRefs).

namespace:
  create: true
  # Defaults to the release namespace.
  name: ""

global:
  imageRegistry: ghcr.io/zjusct
  imagePullSecrets: []
  # Default Gateway reference for every generated HTTPRoute; per-route
  # gatewayRef values fall back to this one.
  gatewayRef:
    name: ""
    namespace: ""
    sectionName: ""

nameOverride: ""
fullnameOverride: ""

# Controller. Runtime configuration below is rendered into the falcon-config
# ConfigMap; any change rolls the Deployment through a checksum annotation.
controller:
  enabled: true
  image:
    repository: falcon
    # Empty tag defaults to Chart.AppVersion; a digest takes precedence.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  revisionHistoryLimit: 10

  # Mirrors the internal/config Go structs; validated at render time and
  # again at controller startup.
  config:
    log:
      # debug | info | warn | error
      level: info
    api:
      # Probes and Services follow the port of each address.
      metricsBindAddress: ":8080"
      healthProbeBindAddress: ":8081"
      webapiBindAddress: ":8082"
    # MirrorZ site section; url is required and must carry a scheme.
    site:
      url: ""
      abbr: ""
      name: ""
      logo: ""
      logo_darkmode: ""
      homepage: ""
      issue: ""
      request: ""
      email: ""
      group: ""
      disk: ""
      note: ""
      big: ""
      disable: false
    catalog:
      enabled: true
    sync:
      # Global sync concurrency cap; <= 0 means unlimited.
      maxConcurrent: 4
    # An empty hostnames list disables publish HTTPRoute generation
    # altogether; mirrorz reflects the request Host against the list.
    publish:
      gatewayRef: {}
      hostnames: []
      labels: {}
      annotations: {}
    auth:
      github:
        clientID: ""
        clientSecret: ""
        allowedUserIDs: []

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      labels: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits: {}

  rbac:
    create: true
    # Cluster-scoped nodes/proxy read backing status.sizeBytes; disabling it
    # leaves sizeBytes empty.
    nodeStats: true

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ZFS usage agent: one read-only DaemonSet pod per storage node feeding
# GET /api/usage.
zfsAgent:
  enabled: false
  image:
    repository: zfs-agent
    # Empty tag defaults to Chart.AppVersion; a digest takes precedence.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Agent flags, e.g. --pools=tank.
  extraArgs: []
  # OTLP HTTP endpoint of a central collector; empty disables metric push.
  otelEndpoint: ""
  # Must match the zfs-localpv nodes (pools are read locally).
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits: {}

# Admin web UI: static Next.js export served by nginx.
webui:
  enabled: false
  image:
    repository: falcon-ui
    # Empty tag defaults to Chart.AppVersion; a digest takes precedence.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits: {}

# Admin domain route: OAuth-gated UI and read-only API.
admin:
  enabled: false
  # Required bare hostname when enabled.
  host: ""
  route:
    gatewayRef: {}
    # Rendered verbatim when set; overrides gatewayRef.
    parentRefs: []
    labels: {}
    annotations: {}

# Catalog hosts publishing /mirrorz.json; by convention mirrors
# controller.config.publish.hostnames.
catalog:
  enabled: false
  hosts: []
  route:
    gatewayRef: {}
    parentRefs: []
    labels: {}
    annotations: {}
