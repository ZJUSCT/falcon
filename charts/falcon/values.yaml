# Default values for the Falcon Helm chart.
# All resources render into the release namespace; the controller watches
# only that namespace (POD_NAMESPACE).

namespace:
  # Create the release namespace if it does not exist.
  create: true
  # Defaults to the release namespace (helm -n).
  name: ""

global:
  # Prefix for all component image repositories; overridable per component.
  imageRegistry: ghcr.io/zjusct
  imagePullSecrets: []
  # Gateway referenced by every generated HTTPRoute. Set namespace to ""
  # when the Gateway lives in the release namespace.
  gatewayRef:
    name: nginx-gateway
    namespace: nginx-gateway
    sectionName: https

nameOverride: ""
fullnameOverride: ""

# Controller (manager). Runtime configuration lives under config and is
# rendered into the falcon-config ConfigMap; any config change rolls the Pod
# through the checksum annotation.

controller:
  enabled: true
  image:
    repository: falcon
    tag: ""            # empty = Chart.AppVersion
    digest: ""         # optional; takes precedence over tag
    pullPolicy: IfNotPresent
  replicaCount: 1
  revisionHistoryLimit: 10

  # Mirrors the internal/config Go structs; validated by the chart at render
  # time and again at controller startup.
  config:
    log:
      level: info                      # debug | info | warn | error
    api:                               # probes and Services depend on these defaults
      metricsBindAddress: ":8080"
      healthProbeBindAddress: ":8081"
      webapiBindAddress: ":8082"
    # Site identity: fallback values for the mirrorz site section; url must
    # carry a scheme.
    site:
      url: https://mirrors.zjusct.io
      abbr: ZJU
      name: Zhejiang University Mirror
    catalog:
      enabled: true                    # toggles GET /mirrorz.json
    sync:
      maxConcurrent: 4                 # global sync concurrency cap; <= 0 = unlimited
    # For every published http service the controller generates an HTTPRoute
    # <name>-publish (PathPrefix /<name> -> Service <name>-publish-http:80);
    # rsync services only get a Service.
    publish:
      gatewayRef: {}                   # falls back to global.gatewayRef
      hostnames:                       # served hostnames; mirrorz reflects the request Host
        - mirrors.zjusct.io
        - mirror.zju.edu.cn
      labels: {}                       # stamped onto every publish HTTPRoute
      annotations: {}
    auth:
      github:
        clientID: ""
        clientSecret: ""
        allowedUserIDs: []

  metrics:
    enabled: true                      # exposes the metrics Service (:8080)
    serviceMonitor:
      enabled: true
      interval: 30s
      labels: {}                       # extra labels for ServiceMonitor selection

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits: {}

  rbac:
    create: true
    # Proxy-read access to kubelet stats summaries (nodes/proxy get) backing
    # Mirror status.sizeBytes. Cluster-scoped, hence rendered as a dedicated
    # <fullname>-node-stats ClusterRole. Disabling leaves sizeBytes empty.
    nodeStats: true

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# ZFS usage agent: one read-only Pod per storage node feeding GET /api/usage.
# Enabling it injects the ZFS_AGENT_SERVICE env var and endpointslices read
# permissions into the controller.
zfsAgent:
  enabled: false
  image:
    repository: zfs-agent
    tag: ""            # empty = Chart.AppVersion
    digest: ""         # optional; takes precedence over tag
    pullPolicy: IfNotPresent
  extraArgs: []        # agent flags, e.g. --pools=tank, --zfs-bin=...
  nodeSelector: {}     # must match the zfs-localpv nodes (pools are read locally)
  tolerations: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits: {}

# Admin web UI: static Next.js export served by nginx on 8080.
webui:
  enabled: false
  image:
    repository: falcon-ui
    tag: ""            # empty = Chart.AppVersion
    digest: ""         # optional; takes precedence over tag
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits: {}

# Admin domain route: OAuth-gated UI and read-only API.
admin:
  enabled: false
  host: ""             # required bare hostname when enabled=true
  route:
    gatewayRef: {}     # falls back to global.gatewayRef
    parentRefs: []     # rendered verbatim when set; overrides gatewayRef
    labels: {}
    annotations: {}

# Catalog hosts publishing /mirrorz.json; by convention mirrors
# controller.config.publish.hostnames.
catalog:
  enabled: true
  hosts:
    - mirrors.zjusct.io
    - mirror.zju.edu.cn
  route:
    gatewayRef: {}
    parentRefs: []
    labels: {}
    annotations: {}

# Mirror/ProxyMirror CRs are not part of this chart. CRDs ship in crds/ and
# are not upgraded by helm — apply them manually on CRD changes.
