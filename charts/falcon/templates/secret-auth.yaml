{{- /*
GitHub OAuth client secret guarding the admin surface, referenced by the
controller through the FALCON_ADMIN_OAUTH_CLIENT_SECRET environment
variable. Rendered only when ui.oauth.clientSecret is set; with
ui.oauth.existingSecret the chart references an externally managed Secret
(same key) instead and renders nothing here.
*/ -}}
{{- if and .Values.controller.enabled .Values.ui.oauth.clientSecret (not .Values.ui.oauth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "falcon.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
type: Opaque
stringData:
  client-secret: {{ .Values.ui.oauth.clientSecret | quote }}
{{- end }}
