{{- /*
Cluster-scoped RBAC for reading kubelet stats summaries through the API
server node proxy (GET /api/v1/nodes/<node>/proxy/stats/summary): the data
source of Mirror status.sizeBytes. nodes/proxy is a cluster-scoped
subresource and cannot be granted by a namespaced Role, so this is the
chart's only cluster-level object; everything else stays namespaced.
*/ -}}
{{- if and .Values.controller.enabled .Values.controller.rbac.create .Values.controller.rbac.nodeStats }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "falcon.fullname" . }}-node-stats
  labels:
    {{- include "falcon.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  - apiGroups:
      - ""
    resources:
      - nodes/proxy
    verbs:
      - get
{{- end }}
