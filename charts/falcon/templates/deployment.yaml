{{- /* Controller (manager) Deployment. */ -}}
{{- if .Values.controller.enabled }}

{{- /*
The liveness/readiness probes and the metrics/mirrorz/admin Services address the
listeners by NAMED ports, so the containerPort numbers below carry the actual
port. They are derived from the configured bind addresses (falcon.port), so
moving a listener here moves its probe and Service targets with it.
*/ -}}
{{- $probePort := include "falcon.port" ":8081" -}}
{{- $metricsPort := include "falcon.port" ":8080" -}}
{{- $mirrorzPort := include "falcon.port" ":8082" -}}
{{- $adminPort := include "falcon.port" ":8083" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "falcon.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  {{- with .Values.controller.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "falcon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        # Rolling restart on config changes: hash of the rendered config file.
        checksum/config: {{ include "falcon.config" . | sha256sum }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "falcon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "falcon.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "falcon.image" (dict "image" .Values.controller.image "defaultTag" .Chart.AppVersion "ctx" $) }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          # No business flags: the whole runtime config lives in the
          # falcon-config ConfigMap (mounted below).
          args:
            - --config=/etc/falcon/config.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if or .Values.ui.oauth.clientSecret .Values.ui.oauth.existingSecret }}
            # Expands ${FALCON_ADMIN_OAUTH_CLIENT_SECRET} inside config.yaml;
            # the value itself lives in a Secret, never in the ConfigMap.
            - name: FALCON_ADMIN_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.ui.oauth.existingSecret }}
                  name: {{ .Values.ui.oauth.existingSecret }}
                  {{- else }}
                  name: {{ include "falcon.fullname" . }}-auth
                  {{- end }}
                  key: client-secret
            {{- end }}
            {{- if .Values.ui.enabled }}
            - name: FALCON_UI_UPSTREAM
              # Use the Service FQDN so the controller's optional outbound
              # HTTP proxy never handles this in-cluster reverse-proxy hop.
              value: http://{{ include "falcon.fullname" . }}-ui.{{ .Release.Namespace }}.svc.cluster.local
            {{- end }}
            {{- if .Values.zfsAgent.enabled }}
            # Wires admin GET /api/usage: the controller aggregates the
            # zfs-agent DaemonSet's reports through this headless Service.
            # Unset (zfsAgent disabled) leaves /api/usage a 404.
            - name: ZFS_AGENT_SERVICE
              value: {{ include "falcon.fullname" . }}-zfs-agent
            {{- end }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ $metricsPort | int }}
              protocol: TCP
            - name: health
              containerPort: {{ $probePort | int }}
              protocol: TCP
            - name: mirrorz
              containerPort: {{ $mirrorzPort | int }}
            - name: admin
              containerPort: {{ $adminPort | int }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/falcon
              readOnly: true
            {{- with .Values.controller.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: falcon-config
        {{- with .Values.controller.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
