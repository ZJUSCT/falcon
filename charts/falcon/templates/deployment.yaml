{{- /* Controller (manager) Deployment. */ -}}
{{- if .Values.controller.enabled }}

{{- /*
The liveness/readiness probes target the health-probe listener
(config api.healthProbeBindAddress). Probe ports must be static in the Pod
spec, so they are hardcoded to 8081 here and rendering fails if the config
moves the listener elsewhere. The same applies to the metrics (:8080) and
webapi (:8082) listeners, which the Services target by number.
*/ -}}
{{- $probeAddr := .Values.controller.config.api.healthProbeBindAddress | default ":8081" -}}
{{- $metricsAddr := .Values.controller.config.api.metricsBindAddress | default ":8080" -}}
{{- $webapiAddr := .Values.controller.config.api.webapiBindAddress | default ":8082" -}}
{{- if ne $probeAddr ":8081" -}}
{{- fail (printf "controller.config.api.healthProbeBindAddress must stay ':8081' (probes are hardcoded to port 8081); got %q" $probeAddr) -}}
{{- end -}}
{{- if ne $metricsAddr ":8080" -}}
{{- fail (printf "controller.config.api.metricsBindAddress must stay ':8080' (the metrics Service targets port 8080); got %q" $metricsAddr) -}}
{{- end -}}
{{- if ne $webapiAddr ":8082" -}}
{{- fail (printf "controller.config.api.webapiBindAddress must stay ':8082' (the webapi Service targets port 8082); got %q" $webapiAddr) -}}
{{- end -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "falcon.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  {{- with .Values.controller.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  replicas: {{ .Values.controller.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "falcon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      annotations:
        # Rolling restart on config changes: hash of the rendered config file.
        checksum/config: {{ include "falcon.config" . | sha256sum }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "falcon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "falcon.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "falcon.image" (dict "image" .Values.controller.image "defaultTag" .Chart.AppVersion "ctx" $) }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          # No business flags: the whole runtime config lives in the
          # falcon-config ConfigMap (mounted below).
          args:
            - --config=/etc/falcon/config.yaml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.webui.enabled }}
            - name: FALCON_UI_UPSTREAM
              # Use the Service FQDN so the controller's optional outbound
              # HTTP proxy never handles this in-cluster reverse-proxy hop.
              value: http://{{ include "falcon.fullname" . }}-ui.{{ .Release.Namespace }}.svc.cluster.local
            {{- end }}
            {{- if .Values.zfsAgent.enabled }}
            # Wires webapi GET /api/usage: the controller aggregates the
            # zfs-agent DaemonSet's reports through this headless Service.
            # Unset (zfsAgent disabled) leaves /api/usage a 404.
            - name: ZFS_AGENT_SERVICE
              value: {{ include "falcon.fullname" . }}-zfs-agent
            {{- end }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: webapi
              containerPort: 8082
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/falcon
              readOnly: true
            {{- with .Values.controller.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: falcon-config
        {{- with .Values.controller.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
