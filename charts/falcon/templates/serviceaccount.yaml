{{- /*
Dedicated ServiceAccount for the controller. Created only when RBAC is
chart-managed; otherwise the Deployment references the "default" SA
(see the falcon.serviceAccountName helper).
*/ -}}
{{- if and .Values.controller.enabled .Values.controller.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "falcon.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
{{- end }}
