{{- /*
Public mirrorz listener of the controller: /mirrorz.json only (the handler
registers nothing else, so this Service structurally cannot expose the admin
API). Exposed on port 80 for the derived mirrorz HTTPRoute.
*/ -}}
{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "falcon.fullname" . }}-mirrorz
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  selector:
    {{- include "falcon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: mirrorz
      port: 80
      targetPort: mirrorz
      protocol: TCP
{{- end }}
