{{- /*
Namespaced Role for the controller. The rules are copied verbatim from
config/rbac/role.yaml (v0.3.0): everything is scoped to the controller's own
namespace; the CRDs themselves are cluster-scoped and installed via crds/.
*/ -}}
{{- if and .Values.controller.enabled .Values.controller.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "falcon.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  # Mirror / ProxyMirror CRs and their status (all in the controller's own
  # namespace; the CRDs themselves are cluster-scoped but a Role suffices for
  # namespaced instances).
  - apiGroups:
      - mirrors.zjusct.io
    resources:
      - mirrors
      - proxymirrors
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - mirrors.zjusct.io
    resources:
      - mirrors/status
      - mirrors/finalizers
      - proxymirrors/status
    verbs:
      - get
      - patch
      - update
  # Child storage and serving workloads.
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - snapshot.storage.k8s.io
    resources:
      - volumesnapshots/status
    verbs:
      - get
      - patch
      - update
  # Serving routes generated by the controller.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Sync Job pods and their logs (diagnostics).
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  # ConfigMaps referenced by Mirror sync volumes.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  # Events emitted by the controller.
  - apiGroups:
      - ""
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  # Leader election Lease (same namespace).
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
{{- end }}
