{{- /*
Admin domain route: authenticated admin UI + read-only API on admin.host.
  PathPrefix /           -> controller webapi Service (auth gateway/proxy)
parentRefs come from admin.route.parentRefs verbatim, or are derived from
admin.route.gatewayRef merged over global.gatewayRef.
*/ -}}
{{- if .Values.admin.enabled }}
{{- if not .Values.admin.host }}
{{- fail "admin.host must not be empty when admin.enabled=true" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9.-]+$" .Values.admin.host) }}
{{- fail "admin.host must be a bare hostname" }}
{{- end }}
{{- if not .Values.webui.enabled }}
{{- fail "admin.enabled=true requires webui.enabled=true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "falcon.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
    {{- with .Values.admin.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.admin.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "falcon.parentRefs" (dict "ctx" $ "section" .Values.admin.route.gatewayRef "parentRefs" .Values.admin.route.parentRefs) | nindent 4 }}
  hostnames:
    - {{ .Values.admin.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "falcon.fullname" . }}-webapi
          port: 80
{{- end }}
