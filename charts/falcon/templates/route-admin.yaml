{{- /*
Admin domain route: admin UI + read-only API on admin.hosts.
  Exact /api/jobs        -> controller webapi Service
  Exact /api/usage       -> controller webapi Service
  PathPrefix /api/repos/ -> controller webapi Service
  PathPrefix /           -> admin web UI Service
parentRefs come from admin.route.parentRefs verbatim, or are derived from
admin.route.gatewayRef merged over global.gatewayRef.
*/ -}}
{{- if .Values.admin.enabled }}
{{- if not .Values.admin.hosts }}
{{- fail "admin.hosts must not be empty when admin.enabled=true" }}
{{- end }}
{{- if not .Values.webui.enabled }}
{{- fail "admin.enabled=true requires webui.enabled=true (the '/' rule routes to the UI Service)" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "falcon.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "falcon.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
    {{- with .Values.admin.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.admin.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- include "falcon.parentRefs" (dict "ctx" $ "section" .Values.admin.route.gatewayRef "parentRefs" .Values.admin.route.parentRefs) | nindent 4 }}
  hostnames:
    {{- range .Values.admin.hosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/jobs
      backendRefs:
        - name: {{ include "falcon.fullname" . }}-webapi
          port: 80
    - matches:
        - path:
            type: Exact
            value: /api/usage
      backendRefs:
        - name: {{ include "falcon.fullname" . }}-webapi
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/repos/
      backendRefs:
        - name: {{ include "falcon.fullname" . }}-webapi
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "falcon.fullname" . }}-ui
          port: 80
{{- end }}
