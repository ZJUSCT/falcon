apiVersion: v2
name: falcon
description: |-
  Falcon — snapshot-based mirror sync and publish on Kubernetes. Deploys the
  namespaced controller (sync Jobs, publish Deployments/Services and Gateway
  API routes for Mirror/ProxyMirror CRs), the admin web UI, and the admin /
  catalog HTTPRoutes.
type: application
version: 0.1.4
appVersion: "v0.3.1"
home: https://github.com/ZJUSCT/falcon
sources:
  - https://github.com/ZJUSCT/falcon
keywords:
  - mirror
  - mirrorz
  - gateway-api
maintainers:
  - name: ZJUSCT
    url: https://github.com/ZJUSCT
annotations:
  # OCI release target (published by .github/workflows/release-chart.yml):
  #   oci://ghcr.io/<owner>/charts/falcon
  org.opencontainers.image.source: https://github.com/ZJUSCT/falcon
