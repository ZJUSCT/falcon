services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
    image: mirrorgo:latest
    container_name: mirrorgo-master
    command: >
      master
      --addr :8080
      --db /data/state.db
      --auth-token "${AUTH_TOKEN}"
      --configs /Configs
      --basedir /home/zjusct/mirrorgo
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MIRRORZ_SITE_URL=https://mirrors.zju.edu.cn
      - MIRRORZ_SITE_LOGO=https://mirrors.zju.edu.cn/zju-falcon.svg
      - MIRRORZ_SITE_ABBR=ZJU
      - MIRRORZ_SITE_NAME=浙江大学开源软件镜像站
      - MIRRORZ_SITE_HOMEPAGE=https://www.zjusct.io
      - MIRRORZ_SITE_REQUEST=https://github.com/ZJUSCT/mirror-issues/issues
      - MIRRORZ_SITE_EMAIL=mirrors@zju.edu.cn
      - MIRRORZ_SITE_DISABLE=false
    volumes:
      - ./Configs:/Configs:ro
      - ./data:/data
      - /home/zjusct/mirrorgo/mirrorgo.json:/home/zjusct/mirrorgo/mirrorgo.json
      - /test1/mirrors/mirrorz.json:/home/zjusct/mirrorgo/mirrorz.json
    restart: unless-stopped

  worker-1:
    image: mirrorgo:latest
    container_name: mirrorgo-worker-1
    command: >
      worker
      --name worker-1
      --master http://master:8080
      --auth-token "${AUTH_TOKEN}"
      --addr :9090
      --labels storage=ssd
      --basedir /home/zjusct/mirrorgo
      --repodir /test1/mirrors/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker
      - /test1/mirrors:/test1/mirrors
      - /home/zjusct/mirrorgo/logs:/home/zjusct/mirrorgo/logs
      - /dev/zfs:/dev/zfs
    privileged: true
    restart: unless-stopped
