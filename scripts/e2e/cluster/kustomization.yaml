# Cluster bootstrap for the e2e scenario, pinned by URL and applied in one
# shot with `kubectl apply -k`. Envoy Gateway and the falcon chart are
# installed outside this kustomization, via helm in run.sh: the EG release
# install.yaml ships the Gateway API CRDs but no GatewayClass, while the
# chart provides both (the CRDs must also exist before the Gateway fixture
# below can be applied).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Volume snapshot CRDs (including group snapshots) and the common
  # snapshot controller, from the upstream kustomizations at v8.6.0 (the
  # controller deployment pins itself to kube-system).
  - https://github.com/kubernetes-csi/external-snapshotter/client/config/crd?ref=v8.6.0
  - https://github.com/kubernetes-csi/external-snapshotter/deploy/kubernetes/snapshot-controller?ref=v8.6.0
  # Hostpath CSI driver v1.18.0 — upstream ships plain manifests with shell
  # installers, no kustomization, so reference the files directly (the
  # deploy/kubernetes-1.35 directory is a symlink to kubernetes-1.34; the
  # driver lands in the default namespace).
  - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-host-path/v1.18.0/deploy/kubernetes-1.34/hostpath/csi-hostpath-plugin.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-host-path/v1.18.0/deploy/kubernetes-1.34/hostpath/csi-hostpath-driverinfo.yaml
  # Sidecar runner ClusterRoles. The plugin's ClusterRoleBindings reference
  # these by name, but the plugin manifests do not create them — upstream
  # deploy.sh pulls them from the sidecar repos. Without them the sidecars
  # cannot watch PVCs/nodes and provisioning never happens. Versions match
  # the sidecar images pinned in the plugin manifest.
  - https://raw.githubusercontent.com/kubernetes-csi/external-provisioner/v6.3.0/deploy/kubernetes/rbac.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-attacher/v4.12.0/deploy/kubernetes/rbac.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-resizer/v2.2.1/deploy/kubernetes/rbac.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/deploy/kubernetes/csi-snapshotter/rbac-csi-snapshotter.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-health-monitor/v0.18.0/deploy/kubernetes/external-health-monitor-controller/rbac.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshot-metadata/v1.0.0/deploy/snapshot-metadata-cluster-role.yaml
  # Local fixtures.
  - namespace.yaml
  - storage.yaml
  - envoyproxy.yaml
  - gatewayclass.yaml
  - gateway.yaml
