# Single control-plane node. Storage and gateway components are installed
# explicitly by run.sh so the scenario only exercises what falcon itself
# depends on, not any distribution defaults.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: falcon-e2e
# containerdConfigPatches:
#   - |-
#     [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.k8s.io"]
#       endpoint = ["https://k8s.m.daocloud.io"]
nodes:
  - role: control-plane
