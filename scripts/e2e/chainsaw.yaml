# Optional full integration scenario. Resource cleanup is deferred to run.sh
# so failures retain Mirror status and children for diagnostics.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: falcon-e2e
spec:
  namespace:
    name: mirror
  timeouts:
    apply: 30s
    assert: 5m
    exec: 60s
    delete: 3m
    cleanup: 3m
