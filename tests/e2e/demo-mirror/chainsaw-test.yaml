# The demo Mirror's full observable chain: sync job succeeded -> snapshot
# ready -> publish rolled out -> route accepted (Ready), the page served
# through the gateway, and the mirrorz.json catalog entry.
#
# Environment contract with scripts/e2e/run.sh (the bootstrap): KUBECONFIG,
# E2E_SITE_HOST and E2E_ENVOY_ADDR are inherited from the chainsaw process.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: demo-mirror
spec:
  steps:
    - name: ready-and-serving
      description: The demo Mirror becomes Ready and serves through the gateway.
      try:
        - apply:
            file: mirror-demo.yaml
        - assert:
            resource:
              apiVersion: mirrors.zjusct.io/v1alpha1
              kind: Mirror
              metadata:
                name: demo
              spec:
                publish:
                  aliases:
                    - path: /DEMO
                    - path: /demo-subset
                      subset:
                        subpath: subset
                  http:
                    podTemplate:
                      metadata:
                        annotations:
                          reloader.stakater.com/auto: "true"
              # Official conditions idiom (chainsaw assertion-trees docs):
              # an expression key filters the conditions array and the
              # expected list matches against the filtered result, ignoring
              # sibling conditions. Hoisted to the resource root so a
              # not-yet-written status is a retryable mismatch instead of a
              # required-field error.
              (status.conditions[?type == 'Ready']):
                - status: "True"
        - script:
            content: >
              curl -sS -H "Host: $E2E_SITE_HOST"
              "http://$E2E_ENVOY_ADDR/demo/index.html"
            outputs:
              - name: PAGE
                value: ($stdout)
        - assert:
            resource:
              # The page is the busybox `date -u` output of the sync job.
              (contains($PAGE, 'UTC')): true
        - script:
            content: |
              alias_redirect=$(curl -sS -o /dev/null \
                -H "Host: $E2E_SITE_HOST" \
                -w '%{http_code} %{redirect_url}' \
                "http://$E2E_ENVOY_ADDR/DEMO/index.html")
              expected="301 http://$E2E_SITE_HOST/demo/index.html"
              if [ "$alias_redirect" != "$expected" ]; then
                echo "got $alias_redirect, want $expected" >&2
                exit 1
              fi
              printf '%s' "$alias_redirect"
            outputs:
              - name: ALIAS_REDIRECT
                value: ($stdout)
        - assert:
            resource:
              (starts_with($ALIAS_REDIRECT, '301 http://')): true
              (!contains($ALIAS_REDIRECT, ':8080')): true
        - script:
            content: >
              curl -sS -L
              --connect-to "$E2E_SITE_HOST:80:$E2E_ENVOY_ADDR"
              "http://$E2E_SITE_HOST/DEMO/index.html"
            outputs:
              - name: ALIAS_PAGE
                value: ($stdout)
        - assert:
            resource:
              (contains($ALIAS_PAGE, 'UTC')): true
        - script:
            content: |
              subset_redirect=$(curl -sS -o /dev/null \
                -H "Host: $E2E_SITE_HOST" \
                -w '%{http_code} %{redirect_url}' \
                "http://$E2E_ENVOY_ADDR/demo-subset/index.html")
              expected="301 http://$E2E_SITE_HOST/demo/subset/index.html"
              if [ "$subset_redirect" != "$expected" ]; then
                echo "got $subset_redirect, want $expected" >&2
                exit 1
              fi
              printf '%s' "$subset_redirect"
            outputs:
              - name: SUBSET_REDIRECT
                value: ($stdout)
        - assert:
            resource:
              (starts_with($SUBSET_REDIRECT, '301 http://')): true
        - script:
            content: >
              curl -sS -L
              --connect-to "$E2E_SITE_HOST:80:$E2E_ENVOY_ADDR"
              "http://$E2E_SITE_HOST/demo-subset/index.html"
            outputs:
              - name: SUBSET_PAGE
                value: ($stdout)
        - assert:
            resource:
              (contains($SUBSET_PAGE, 'UTC')): true
        - script:
            content: >
              curl -sS -H "Host: $E2E_SITE_HOST"
              "http://$E2E_ENVOY_ADDR/mirrorz.json"
              | jq -j '.mirrors[] | select(.cname == "demo") | .status'
            outputs:
              - name: STATUS
                value: ($stdout)
        - assert:
            resource:
              (starts_with($STATUS, 'S')): true
        - script:
            content: >
              curl -sS -H "Host: $E2E_SITE_HOST"
              "http://$E2E_ENVOY_ADDR/mirrorz.json"
              | jq -j '.mirrors[] | select(.cname == "demo-subset") | .status'
            outputs:
              - name: SUBSET_STATUS
                value: ($stdout)
        - assert:
            resource:
              # A subset entry projects the parent's sync freshness verbatim.
              ($SUBSET_STATUS == $STATUS): true
    - name: proxy-subset
      description: A subset redirects to the parent proxy path and the proxy backend serves it.
      try:
        - apply:
            file: proxy-demo.yaml
        - assert:
            resource:
              apiVersion: mirrors.zjusct.io/v1alpha1
              kind: Mirror
              metadata:
                name: proxy-demo
              (status.conditions[?type == 'Ready']):
                - status: "True"
        - script:
            content: bash proxy-subset.sh
    - name: reloader-mutation
      description: Reloader stamps the opted-in Deployment after its ConfigMap changes.
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: demo-publish-http
              spec:
                template:
                  metadata:
                    annotations:
                      reloader.stakater.com/auto: "true"
        - script:
            content: >
              kubectl -n mirror patch configmap demo-publish-config --type merge
              -p '{"data":{"revision":"reloaded"}}'
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: demo-publish-http
              (spec.template.metadata.annotations."reloader.stakater.com/last-reloaded-from" != ''): true
    - name: redirect-roundtrip
      description: Redirect suppresses serving while sync continues; recovery publishes the latest snapshot.
      timeouts:
        exec: 8m
      try:
        - script:
            content: bash redirect-roundtrip.sh
