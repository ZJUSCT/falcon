# Falcon admin UI — static file server.
#
# Written to run as a non-root user (uid/gid 101) with a read-only root
# filesystem: pid file and every temp path live under /tmp, logs go to
# stdout/stderr. No proxying — see Dockerfile for the serving topology.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

# Only meaningful when the master runs as root; ignored (warned) otherwise.
user nginx;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  # Keep all writable state under /tmp (readOnlyRootFilesystem-safe).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check for the Service/Deployment probes.
    location = /healthz {
      access_log off;
      add_header Cache-Control "no-store";
      return 200 'ok';
    }

    # The app routes via URL hash (#/mirrors/<id>), so only "/" is requested
    # in practice; still, resolve stale deep links to the app shell.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Content-hashed build assets never change: cache hard.
    location /_next/static/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
